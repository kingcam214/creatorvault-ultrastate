name: Deploy to CreatorVault VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, linux, creatorvault-production]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: |
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          npm install -g pnpm@10.4.1 2>/dev/null || true
          pnpm --version

      - name: Install dependencies
        run: |
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          pnpm install --frozen-lockfile

      - name: Generate release stamp
        run: |
          mkdir -p client/public
          echo "{\"commit\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"timestamp\":\"$(date -Iseconds)\",\"environment\":\"production\"}" > client/public/release.json

      - name: Build release
        run: |
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          pnpm build

      - name: Verify build artifacts
        run: |
          test -f dist/index.js
          test -f dist/public/index.html
          test -f dist/public/release.json
          echo "Build artifacts verified"

      - name: Deploy to production
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          COMMIT="${{ github.sha }}"

          # Stage built dist atomically in the root-owned application directory.
          # Remove an interrupted prior stage so cp cannot nest the next release.
          sudo rm -rf /root/creatorvault/dist.new 2>/dev/null || true
          sudo cp -r dist /root/creatorvault/dist.new
          sudo rm -rf /root/creatorvault/dist.old 2>/dev/null || true
          sudo mv /root/creatorvault/dist /root/creatorvault/dist.old 2>/dev/null || true
          sudo mv /root/creatorvault/dist.new /root/creatorvault/dist

          # Copy package files
          sudo cp package.json pnpm-lock.yaml /root/creatorvault/

          # Install production deps inside the root-owned application directory.
          # The self-hosted runner cannot cd into /root before sudo.
          sudo env PATH="$PATH" bash -c 'cd /root/creatorvault && pnpm install --frozen-lockfile'

          # Run the committed production entrypoint from the application directory.
          sudo env PATH="$PATH" bash -c 'cd /root/creatorvault && chmod +x ./deploy_work_to_prod.sh && ./deploy_work_to_prod.sh'

          # Verify release stamp (full SHA or short SHA prefix both accepted)
          DEPLOY_SHA="${{ github.sha }}"
          sudo env PATH="$PATH" node -e "
            const r=require('fs').readFileSync('/root/creatorvault/dist/public/release.json','utf8');
            const parsed=JSON.parse(r);
            const commit='${{ github.sha }}';
            if(parsed.commit !== commit && !commit.startsWith(parsed.commit) && !parsed.commit.startsWith(commit)) {
              console.error('Release mismatch:', r);
              process.exit(1);
            }
            console.log('release-stamp-ok', r);
          "

          # Reload app
          sudo pm2 reload creatorvault --update-env || sudo pm2 restart creatorvault --update-env
          echo "Deployment complete"
