name: Deploy to CreatorVault VPS

on:
  push:
    branches:
      - main

concurrency:
  group: creatorvault-production-security-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CREATORVAULT_RELEASE_BEFORE: ${{ github.event.before }}
  CREATORVAULT_RELEASE_SHA: ${{ github.sha }}
  CREATORVAULT_RELEASE_REF: ${{ github.ref }}
  CREATORVAULT_RELEASE_EVENT: ${{ github.event_name }}
  CREATORVAULT_RELEASE_WORKSPACE: ${{ github.workspace }}

jobs:
  deploy:
    runs-on: [self-hosted, linux, creatorvault-production]
    timeout-minutes: 45
    steps:
      - name: Restore disposable build ownership for checkout
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'push'
          sudo -n env PATH="$PATH" RUNNER_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_BUILD_UID="$(id -u)" RUNNER_BUILD_GID="$(id -g)" node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const workspace=process.env.RUNNER_WORKSPACE,uid=Number(process.env.RUNNER_BUILD_UID),gid=Number(process.env.RUNNER_BUILD_GID);
          if(process.getuid()!==0 || !workspace || !workspace.includes('/_work/') || workspace.startsWith('/root/creatorvault/') || workspace==='/root/creatorvault' || !Number.isSafeInteger(uid) || !Number.isSafeInteger(gid) || uid<0 || gid<0)throw new Error('UNSAFE_DISPOSABLE_BUILD_METADATA_ROOT');
          const root=path.join(workspace,'dist');
          const meta=await fs.lstat(root).catch(error=>{if(error.code==='ENOENT')return undefined;throw error;});
          if(meta){if(await fs.realpath(workspace)!==workspace || await fs.realpath(root)!==root)throw new Error('UNSAFE_DISPOSABLE_BUILD_METADATA_ROOT');const items=[];async function walk(file){const m=await fs.lstat(file);if(m.isSymbolicLink() || (!m.isDirectory()&&!m.isFile()) || (m.isFile()&&m.nlink!==1))throw new Error('UNSAFE_DISPOSABLE_BUILD_METADATA_PATH');items.push(file);if(m.isDirectory())for(const child of await fs.readdir(file))await walk(path.join(file,child));}await walk(root);for(const file of items)await fs.chown(file,uid,gid);}
          console.log('DISPOSABLE_BUILD_OWNER_RESTORED_PRODUCTION_UNCHANGED');
          JS

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved Body Cinema Phase A successor trigger
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'push'
          checkout_parent='532c3de5fb7bafcbeb47560697bcb8cbd95d8401'
          test "$CREATORVAULT_RELEASE_BEFORE" = "$checkout_parent"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_SHA^")" = "$checkout_parent"
          git merge-base --is-ancestor 3762e69c7bf5e59b3e6070085f2fbd4b3fb2c8da HEAD
          git merge-base --is-ancestor ccba8cd56f887d041311d4f37d3ec912fd57322d HEAD
          git merge-base --is-ancestor d0bec580d387f962bb779663f873c9e642f57ae3 HEAD
          git merge-base --is-ancestor be17b8462c926d5f5c9c57111e7e7f328e9e8f2c HEAD
          case "$(realpath "$GITHUB_WORKSPACE")/" in /root/creatorvault/*) exit 42 ;; esac
          test ! -L dist
          if test -d dist; then test -z "$(find dist -type l -printf x -quit)"; fi

      - name: Enable pnpm
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          command -v pnpm >/dev/null
          pnpm --version

      - name: Install dependencies
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          pnpm install --frozen-lockfile

      - name: Validate Phase A release scope and preserved security
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          pnpm exec tsx scripts/consolidatedReleaseRunner.ts --check-checkout
          git diff --check
          bash -n deploy_work_to_prod.sh scripts/run-consolidation-regressions.sh scripts/run-historical-security-release-checks.sh

      - name: Historical completed security-controller regressions
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          bash scripts/run-historical-security-release-checks.sh

      - name: Current security regression tests
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          pnpm test:security

      - name: Strict security type check
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          pnpm check:security

      - name: Isolated regression prerequisite availability
        run: |
          set -euo pipefail
          command -v apt-get >/dev/null
          command -v dpkg-deb >/dev/null
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          # Database binaries are extracted privately if needed, never installed.
          sudo -n apt-get update -qq

      - name: Retained Stripe Persona Video Studio and additive migration regressions
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          sudo -n env PATH="$PATH" bash "$GITHUB_WORKSPACE/scripts/run-consolidation-regressions.sh"

      - name: Native Body Cinema Phase A lifecycle regressions
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          sudo -n env PATH="$PATH" bash "$GITHUB_WORKSPACE/scripts/run-body-cinema-phase-a-tests.sh"

      - name: Strict feature and non-rotating deployment type checks
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          pnpm check:stripe-payouts
          pnpm check:persona-continuity
          pnpm check:video-studio
          pnpm check:consolidated-release

      - name: Mandatory whole-project type check
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import v8 from 'node:v8';
          const mem=Object.fromEntries([...fs.readFileSync('/proc/meminfo','utf8').matchAll(/^(MemTotal|MemAvailable|SwapFree):\s+(\d+) kB$/gm)].map(m=>[m[1],Number(m[2])*1024]));
          let ram=mem.MemAvailable, swap=mem.SwapFree;
          const group=/^0::(.*)$/m.exec(fs.readFileSync('/proc/self/cgroup','utf8'))?.[1];
          const root=group ? path.resolve('/sys/fs/cgroup','.'+group) : '/sys/fs/cgroup';
          const read=(name)=>{for(const dir of [root,'/sys/fs/cgroup']){const file=path.join(dir,name);if(fs.existsSync(file))return fs.readFileSync(file,'utf8').trim();}return undefined;};
          const bound=(available,max,current)=>max!==undefined && max!=='max' ? Math.min(available,Math.max(0,Number(max)-Number(current))) : available;
          ram=bound(ram,read('memory.max'),read('memory.current'));
          swap=bound(swap,read('memory.swap.max'),read('memory.swap.current'));
          const mib=n=>Math.floor(n/1048576);
          console.log(JSON.stringify({node:process.version,totalRamMiB:mib(mem.MemTotal),availableRamMiB:mib(ram),availableSwapMiB:mib(swap),heapLimitMiB:mib(v8.getHeapStatistics().heap_size_limit),requiredHeadroomMiB:2560}));
          if(!Number.isFinite(ram+swap) || ram+swap < 2560*1048576) throw new Error('INSUFFICIENT_RUNNER_MEMORY_FOR_COLD_TYPECHECK');
          JS
          pnpm check

      - name: Build production server
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          pnpm build:server

      - name: Build production client
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          pnpm build:client

      - name: Stamp and validate guarded consolidated artifact
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          pnpm exec tsx -e 'import {prepareConsolidatedReleaseArtifact} from "./scripts/prepareConsolidatedReleaseArtifact"; prepareConsolidatedReleaseArtifact(process.cwd()).catch(()=>{console.error("CONSOLIDATED_ARTIFACT_PREPARATION_FAILED");process.exitCode=1;});'
          test -f dist/index.js
          test -f dist/secure-app.js
          test -f dist/consolidated-release-runtime.mjs
          test -f dist/public/index.html
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("dist/public/release.json", JSON.stringify({commit:process.env.GITHUB_SHA,branch:"main",timestamp:new Date().toISOString(),environment:"production"})+"\n");'
          sudo -n env PATH="$PATH" ARTIFACT_ROOT="$GITHUB_WORKSPACE/dist" node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {pathToFileURL} from 'node:url';
          const root=process.env.ARTIFACT_ROOT;
          if(process.getuid()!==0 || !root || await fs.realpath(root)!==root || root==='/root/creatorvault/dist' || root.startsWith('/root/creatorvault/'))throw new Error('UNSAFE_BUILD_METADATA_ROOT');
          const {BASELINE_STATIC_HOMEPAGE_ASSETS,isBaselineStaticHomepagePath}=await import(pathToFileURL(path.join(root,'consolidated-release-runtime.mjs')).href);
          const items=[];
          async function walk(file){const meta=await fs.lstat(file);if(meta.isSymbolicLink() || (!meta.isDirectory()&&!meta.isFile()) || (meta.isFile()&&meta.nlink!==1))throw new Error('UNSAFE_BUILD_METADATA_PATH');const relative=path.relative(root,file);if((/(^|\/)(?:\.env(?:\.|$)|node_modules|uploads|logs)(?:\/|$)/.test(relative)&&!isBaselineStaticHomepagePath(relative,meta.isDirectory()))||/\.(?:pem|key|crt|p12)$/i.test(relative))throw new Error('UNSAFE_BUILD_METADATA_CONTENT');items.push({file,meta});if(meta.isDirectory()){for(const child of await fs.readdir(file))await walk(path.join(file,child));}}
          await walk(root);
          async function digest(){const hash=crypto.createHash('sha256');for(const item of items){const relative=path.relative(root,item.file);hash.update(relative+'\0');if(item.meta.isFile()){const h=await fs.open(item.file,'r');const staticHash=crypto.createHash('sha256');try{for await(const chunk of h.createReadStream()){hash.update(chunk);staticHash.update(chunk);}}finally{await h.close();}if(Object.hasOwn(BASELINE_STATIC_HOMEPAGE_ASSETS,relative)&&staticHash.digest('hex')!==BASELINE_STATIC_HOMEPAGE_ASSETS[relative])throw new Error('STATIC_BASELINE_ASSET_CHANGED');}}return hash.digest('hex');}
          const before=await digest();
          for(const item of items){if(item.meta.uid!==0||item.meta.gid!==0)await fs.chown(item.file,0,0);await fs.chmod(item.file,item.meta.isDirectory()?0o750:0o640);}
          if(await digest()!==before)throw new Error('BUILD_BYTES_CHANGED_DURING_METADATA_SEAL');
          console.log('TEMPORARY_BUILD_METADATA_SEALED_BYTES_UNCHANGED');
          JS

      - name: Verify existing approved additive schema and deploy without rotating sessions
        run: |
          set -euo pipefail
          export PNPM_HOME="/home/runner/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          sudo -n env PATH="$PATH" \
            CREATORVAULT_RELEASE_SHA="$GITHUB_SHA" \
            CREATORVAULT_RELEASE_REF="$GITHUB_REF" \
            CREATORVAULT_RELEASE_EVENT="$GITHUB_EVENT_NAME" \
            CREATORVAULT_RELEASE_BEFORE="$CREATORVAULT_RELEASE_BEFORE" \
            CREATORVAULT_RELEASE_WORKSPACE="$GITHUB_WORKSPACE" \
            bash "$GITHUB_WORKSPACE/deploy_work_to_prod.sh"
