name: CreatorVault Runner Storage Hygiene 2026-10-13
'on':
  push:
    branches:
    - ops/runner-storage-2026-10-13
permissions:
  contents: read
concurrency:
  group: creatorvault-production-security-release
  cancel-in-progress: false
jobs:
  hygiene:
    runs-on:
    - self-hosted
    - linux
    - creatorvault-production
    timeout-minutes: 20
    steps:
    - name: inspect exact migration metadata and retained row preservation read-only
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REF\" = 'refs/heads/ops/runner-storage-2026-10-13'\nsudo -n /usr/bin/python3 - <<'PY'\nimport os,json,subprocess,re\nfrom pathlib import Path\nENV={'PATH':'/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin','HOME':'/root','PM2_HOME':'/root/.pm2','LC_ALL':'C'}\nassert os.geteuid()==0\nassert subprocess.check_output(['curl','--noproxy','*','-fsS','--max-time','3','http://169.254.169.254/metadata/v1/id'],env=ENV,text=True).strip()=='545144175'\nroot=Path('/root/creatorvault');assert json.loads((root/'dist/public/release.json').read_text())['commit']=='3a47ce4dc7178893e958ed491a136c9749242033'\nscript=\"\"\"\nconst fs=require('fs'),crypto=require('crypto');const{createRequire}=require('module');const requireApp=createRequire('/root/creatorvault/package.json');const mysql=requireApp('mysql2/promise'),dotenv=requireApp('dotenv');\nfunction emit(x){console.log(JSON.stringify(x));}\n(async()=>{let c;try{\nconst env=dotenv.parse(fs.readFileSync('/root/creatorvault/.env'));if(!env.DATABASE_URL)throw Error('DATABASE_REFERENCE_MISSING');c=await mysql.createConnection(env.DATABASE_URL);await c.query('START TRANSACTION READ ONLY');\nconst [version]=await c.query('SELECT VERSION() AS version');emit({kind:'database_version',rows:version});\nconst [columns]=await c.execute('SELECT COLUMN_NAME, DATA_TYPE, COLUMN_TYPE, IS_NULLABLE, CHARACTER_MAXIMUM_LENGTH, DATETIME_PRECISION, COLUMN_DEFAULT, EXTRA, GENERATION_EXPRESSION, COLLATION_NAME FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=? ORDER BY ORDINAL_POSITION',['body_cinema_candidate_lifecycles']);emit({kind:'lifecycle_column_metadata',rows:columns});\nconst [indexes]=await c.execute('SELECT INDEX_NAME, NON_UNIQUE, SEQ_IN_INDEX, COLUMN_NAME FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=? ORDER BY INDEX_NAME,SEQ_IN_INDEX',['body_cinema_candidate_lifecycles']);emit({kind:'lifecycle_index_metadata',rows:indexes});\nconst [ledger]=await c.query(\\\"SELECT hash,created_at FROM __drizzle_migrations WHERE created_at IN (-1791993600000,1791993600000)\\\");emit({kind:'migration_0027_ledger',rows:ledger});\nconst names=['id','project_id','creator_id','source_asset_id','source_sha256','source_snapshot_json','rights_assertion_json','rights_assertion_hash','treatment_version','treatment_json','treatment_hash','state','candidate_asset_id','candidate_sha256','candidate_snapshot_json','candidate_provenance_json','attachment_authorization_json','review_id','review_json','decision_json','handoff_json','created_at','updated_at'];\nconst projection=names.map(n=>'HEX(CAST(`'+n+'` AS BINARY)) AS `'+n+'`').join(', ');const h=crypto.createHash('sha256');h.update(JSON.stringify(names));let last=null,count=0;\nfor(;;){const sql='SELECT '+projection+' FROM body_cinema_candidate_lifecycles '+(last?'WHERE CAST(id AS BINARY)>UNHEX(?) ':'')+'ORDER BY CAST(id AS BINARY) LIMIT32'.replace('LIMIT32','LIMIT 32');const [rows]=await c.execute(sql,last?[last]:[]);if(!rows.length)break;for(const row of rows){h.update('row:');for(const n of names){const v=row[n];if(v===null)h.update('N;');else if(typeof v==='string'&&/^(?:[0-9A-F]{2})*$/.test(v))h.update('S'+v.length+':'+v+';');else throw Error('INVALID_RAW_FINGERPRINT');}last=row.id;count++;}}\nconst fp='body_cinema.0027.preservation.v1:'+count+':'+h.digest('hex');emit({kind:'historical_row_preservation_readonly',currentFingerprint:fp,intentMatches:ledger.some(r=>r.hash===fp&&Number(r.created_at)===-1791993600000),count});\nawait c.rollback();\n}catch(e){emit({kind:'schema_readonly_failed',code:e.code||e.message||'ERROR'});process.exitCode=1;}finally{if(c)await c.end();}})();\n\"\"\"\np=subprocess.run(['node','-e',script],cwd=root,env=ENV,text=True,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=90);print(p.stdout,flush=True);assert p.returncode==0,'SCHEMA_DIAGNOSTIC_FAILED'\nstatefile=root/'.consolidated-release-state-4a3b5609f7849f547af38541550658979dbec222.json'\nif statefile.is_file():\n d=json.loads(statefile.read_text());print(json.dumps({'kind':'failed_release_state','sha':d.get('sha'),'phase':d.get('phase'),'code':d.get('code')}),flush=True)\ns=os.statvfs(root);print(json.dumps({'kind':'capacity_after_guarded_stop','availableBytes':s.f_bavail*s.f_frsize,'freeInodes':s.f_favail}),flush=True)\nprint(json.dumps({'kind':'schema_readonly_complete','databaseWrites':False,'newRender':False}),flush=True)\nPY\n"
