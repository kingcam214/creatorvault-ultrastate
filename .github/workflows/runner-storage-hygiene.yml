name: CreatorVault Runner Storage Hygiene 2026-10-13
'on':
  push:
    branches:
    - ops/runner-storage-2026-10-13
permissions:
  contents: read
concurrency:
  group: creatorvault-production-security-release
  cancel-in-progress: false
jobs:
  hygiene:
    runs-on:
    - self-hosted
    - linux
    - creatorvault-production
    timeout-minutes: 12
    steps:
    - name: Read-only exact remaining cache qualification
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REF\" = 'refs/heads/ops/runner-storage-2026-10-13'\nsudo -n /usr/bin/python3 - <<'PY'\nimport os,json,stat,subprocess,glob,time,shutil\nfrom pathlib import Path\nENV={'PATH':'/home/runner/.local/share/pnpm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin','LC_ALL':'C','HOME':'/root','PM2_HOME':'/root/.pm2'}\ndef emit(x):print(json.dumps(x),flush=True)\ndef cmd(args,timeout=90):\n p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=timeout,env=ENV,cwd='/root/creatorvault');return p.stdout.strip(),p.returncode\nassert os.geteuid()==0\nassert cmd(['curl','--noproxy','*','-fsS','--max-time','3','http://169.254.169.254/metadata/v1/id'])[0]=='545144175'\nassert json.loads(Path('/root/creatorvault/dist/public/release.json').read_text())['commit']=='3a47ce4dc7178893e958ed491a136c9749242033'\nfor args in [['pnpm','--version'],['pnpm','store','path'],['pnpm','store','prune','--help'],['/usr/local/bin/pnpm','--version'],['/usr/local/bin/pnpm','store','path']]:\n try:out,code=cmd(args);emit({'kind':'package_tool_metadata','command':args,'exit':code,'output':out[:6000]})\n except OSError:emit({'kind':'package_tool_metadata','command':args,'missing':True})\nfor cache in ['/root/.local/share/pnpm/store','/home/runner/.local/share/pnpm/store']:\n counts={};largest=[]\n for directory,ds,fs in os.walk(cache,followlinks=False):\n  for name in fs:\n   p=Path(directory)/name;m=p.lstat()\n   if not stat.S_ISREG(m.st_mode):continue\n   key=str(m.st_nlink);entry=counts.setdefault(key,{'files':0,'allocatedBytes':0});entry['files']+=1;entry['allocatedBytes']+=m.st_blocks*512\n emit({'kind':'package_store_link_counts','path':cache,'links':counts})\nfor p in Path('/var/log').iterdir():\n m=p.lstat()\n if stat.S_ISREG(m.st_mode) and m.st_size>1048576:emit({'kind':'system_log_file_metadata','path':str(p),'bytes':m.st_size,'allocatedBytes':m.st_blocks*512,'mtimeUtc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime(m.st_mtime)),'nlink':m.st_nlink})\nfor args in [['du','-x','--block-size=1','--max-depth=2','/opt','/home','/var/lib','/var/cache'],['find','/root/.local/share/pnpm/.tools','/home/runner/.local/share/pnpm/.tools','-maxdepth','6','-type','f','-name','pnpm.cjs'],['readlink','-f','/usr/local/bin/pnpm'],['readlink','-f','/home/runner/.local/share/pnpm/pnpm']]:\n out,code=cmd(args,timeout=150)\n if args[0]=='du':\n  rows=[]\n  for line in out.splitlines():\n   if '\\t' in line:\n    size,name=line.split('\\t',1)\n    if size.isdecimal():rows.append({'bytes':int(size),'path':name})\n  emit({'kind':'remaining_top_sizes','rows':sorted(rows,key=lambda x:x['bytes'],reverse=True)[:35],'exit':code})\n else:emit({'kind':'package_tool_metadata','command':args,'exit':code,'output':out[:4000]})\n# Check every process for open or mapped cache usage without exposing environment/argv values.\nfor name in ['cwd','exe','fd/*']:\n refs=[]\n for item in glob.glob('/proc/[0-9]*/'+name):\n  try:value=os.readlink(item)\n  except OSError:continue\n  if value.startswith('/root/.cache/') or '/.local/share/pnpm/store/' in value:refs.append({'pid':int(item.split('/')[2]),'path':value})\n emit({'kind':'cache_process_references','type':name,'rows':refs})\nemit({'kind':'bulk_cache_qualification_complete','filesDeleted':False})\n\nfor directory in ['/var/lib/snapd/cache','/root/.npm','/home/runner/.npm','/root/.cache/ffmpeg-static-nodejs']:\n p=Path(directory);count=allocated=0\n if p.exists():\n  for entry in p.rglob('*'):\n   m=entry.lstat()\n   if stat.S_ISREG(m.st_mode) and m.st_nlink==1 and m.st_mtime<time.time()-86400:count+=1;allocated+=m.st_blocks*512\n emit({'kind':'old_unique_download_cache_upper_bound','path':directory,'fileCount':count,'allocatedBytes':allocated,'deletionPerformed':False})\nPY\n"
