name: CreatorVault Runner Storage Hygiene 2026-10-13
on:
  push:
    branches: [ops/runner-storage-2026-10-13]
permissions:
  contents: read
concurrency:
  group: creatorvault-production-security-release
  cancel-in-progress: false
jobs:
  hygiene:
    runs-on: [self-hosted, linux, creatorvault-production]
    timeout-minutes: 12
    steps:
      - name: Read-only rejected updater path inspection
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/runner-storage-2026-10-13'
          sudo -n /usr/bin/python3 - <<'PY'
          import json,os,stat,glob,hashlib
          from pathlib import Path
          root=Path('/home/runner/actions-runner/_work/_update');opened=set()
          for f in glob.glob('/proc/[0-9]*/fd/*'):
           try:m=os.stat(f);opened.add((m.st_dev,m.st_ino))
           except OSError:pass
          bad=[]
          for directory,ds,fs in os.walk(root,followlinks=False):
           for name in ds+fs:
            p=Path(directory)/name;m=p.lstat()
            if p.is_symlink() or not(stat.S_ISDIR(m.st_mode) or stat.S_ISREG(m.st_mode)) or name in ['.git','.env','uploads','media','backups','credentials'] or (m.st_dev,m.st_ino) in opened:
             bad.append({'relative':str(p.relative_to(root)),'symlink':p.is_symlink(),'resolvedInsidePayload':str(p.resolve()).startswith(str(root)+'/'),'protectedName':name in ['.git','.env','uploads','media','backups','credentials'],'open':(m.st_dev,m.st_ino) in opened})
          print(json.dumps({'kind':'orphan_update_rejected_paths','rows':bad[:40],'count':len(bad)}),flush=True)
          for f in Path('/root/.cache/ms-playwright/.links').iterdir():
           if f.is_file() and f.stat().st_size<4096:
            target=Path(f.read_text().strip());print(json.dumps({'kind':'browser_cache_owner','ownerPath':str(target),'ownerExists':target.exists(),'ownerValidPackage':(target/'package.json').exists()}),flush=True)
          PY
