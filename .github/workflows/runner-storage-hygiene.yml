name: CreatorVault Runner Storage Hygiene 2026-10-13
'on':
  push:
    branches:
    - ops/runner-storage-2026-10-13
permissions:
  contents: read
concurrency:
  group: creatorvault-production-security-release
  cancel-in-progress: false
jobs:
  hygiene:
    runs-on:
    - self-hosted
    - linux
    - creatorvault-production
    timeout-minutes: 20
    steps:
    - name: verify MySQL compatibility successor runtime and free space read only
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REF\" = 'refs/heads/ops/runner-storage-2026-10-13'\nsudo -n /usr/bin/python3 - <<'PY'\nimport os,json,stat,subprocess,datetime,hashlib\nfrom pathlib import Path\nENV={'PATH':'/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin','LC_ALL':'C','HOME':'/root','PM2_HOME':'/root/.pm2'}\ndef emit(x):print(json.dumps(x),flush=True)\ndef cmd(a):return subprocess.check_output(a,text=True,timeout=45,stderr=subprocess.DEVNULL,env=ENV,cwd='/root/creatorvault').strip()\nsha='43197ff412d92324db03559b63eafc578d62dcbf';root=Path('/root/creatorvault');runner=Path('/home/runner/actions-runner')\nassert os.geteuid()==0 and cmd(['curl','--noproxy','*','-fsS','--max-time','3','http://169.254.169.254/metadata/v1/id'])=='545144175'\nassert root.resolve()==root and not root.is_symlink()\nstamp=json.loads((root/'dist/public/release.json').read_text());assert stamp['commit']==sha\nstatefile=root/('.consolidated-release-state-'+sha+'.json');m=statefile.lstat();assert stat.S_ISREG(m.st_mode) and m.st_uid==0 and (m.st_mode&0o077)==0\nstate=json.loads(statefile.read_text());assert state['sha']==sha and state['phase']=='verified'\nrows=json.loads(cmd(['pm2','jlist']));apps=[x for x in rows if x['name']=='creatorvault'];assert len(apps)==1\napp=apps[0];e=app['pm2_env'];pid=app['pid'];assert e['status']=='online' and e['pm_cwd']==str(root) and e['pm_exec_path']==str(root/'dist/index.js') and e['exec_mode']=='fork_mode' and e['instances']==1 and os.stat('/proc/'+str(pid)).st_uid==0\nfor p in [root,runner/'_diag',Path('/tmp')]:\n s=os.statvfs(p);emit({'kind':'post_deploy_filesystem','path':str(p),'availableBytes':s.f_bavail*s.f_frsize,'freeInodes':s.f_favail,'totalBytes':s.f_blocks*s.f_frsize})\nprint(cmd(['df','-h','/']),flush=True);print(cmd(['df','-i','/']),flush=True)\nemit({'kind':'canonical_runtime_post_deploy','sha':sha,'statePhase':state['phase'],'stateCode':state['code'],'pid':pid,'restartCount':e.get('restart_time'),'status':e['status'],'instances':e['instances'],'mode':e['exec_mode'],'ownerUid':os.stat('/proc/'+str(pid)).st_uid,'cwd':e['pm_cwd'],'entry':e['pm_exec_path'],'bootUnitEnabled':cmd(['systemctl','is-enabled','pm2-root.service'])=='enabled','guardedStateVerified':True})\nemit({'kind':'retained_storage_after_deployment','creatorUploadsPresent':Path('/root/uploads').is_dir(),'databaseDataPresent':Path('/var/lib/mysql').is_dir(),'backupRootPresent':Path('/opt/backups').is_dir(),'appGitPresent':(root/'.git').is_dir(),'runnerGitPresent':(runner/'_work/creatorvault-ultrastate/creatorvault-ultrastate/.git').is_dir(),'activeRunnerBin':str((runner/'bin').resolve()),'activeRunnerExternals':str((runner/'externals').resolve()),'dockerContainers':cmd(['docker','--host','unix:///var/run/docker.sock','ps','-a','--format','{{.ID}}\\t{{.Status}}']).splitlines(),'oldSqlBackupsPresent':all(Path(p).is_file() for p in ['/tmp/creatorvault_2026-10-08_03-05-01.sql','/tmp/creatorvault_2026-10-11_03-05-01.sql'])})\nemit({'kind':'post_deploy_readonly_complete','sha':sha,'filesChanged':False,'generationTriggered':False,'externalSpendUsd':0,'at':datetime.datetime.now(datetime.timezone.utc).isoformat()})\nPY\n"
