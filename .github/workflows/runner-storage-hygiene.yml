0565648.2781117, 'ageHours': 544.611, 'inode': 2883605, 'device': 64769, 'nlink': 1, 'open': False}, {'kind': 'backup_file', 'path': '/opt/backups/app/app_2026-09-27_03-20-02.tar.gz', 'size': 1399482414, 'allocatedBytes': 1399488512, 'mtime': 1790479247.1868975, 'ageHours': 568.612, 'inode': 2883625, 'device': 64769, 'nlink': 1, 'open': False}, {'kind': 'backup_file', 'path': '/opt/backups/app/app_2026-09-26_03-20-01.tar.gz', 'size': 1399481276, 'allocatedBytes': 1399488512, 'mtime': 1790392847.8079653, 'ageHours': 592.611, 'inode': 2883589, 'device': 64769, 'nlink': 1, 'open': False}, {'kind': 'backup_file', 'path': '/opt/backups/app/app_2026-09-25_03-20-01.tar.gz', 'size': 1399480573, 'allocatedBytes': 1399488512, 'mtime': 1790306447.410785, 'ageHours': 616.612, 'inode': 2883630, 'device': 64769, 'nlink': 1, 'open': False}, {'kind': 'backup_file', 'path': '/opt/backups/app/app_2026-09-24_03-20-01.tar.gz', 'size': 1399484080, 'allocatedBytes': 1399488512, 'mtime': 1790220046.9073093, 'ageHours': 640.612, 'inode': 2883621, 'device': 64769, 'nlink': 1, 'open': False}, {'kind': 'backup_file', 'path': '/opt/backups/app/app_2026-09-23_03-20-01.tar.gz', 'size': 1399481945, 'allocatedBytes': 1399488512, 'mtime': 1790133647.6410012, 'ageHours': 664.611, 'inode': 2883629, 'device': 64769, 'nlink': 1, 'open': False}, {'kind': 'backup_file', 'path': '/opt/backups/app/app_2026-09-22_03-20-01.tar.gz', 'size': 1399482072, 'allocatedBytes': 1399488512, 'mtime': 1790047246.7570968, 'ageHours': 688.612, 'inode': 2883620, 'device': 64769, 'nlink': 1, 'open': False}, {'kind': 'backup_file', 'path': '/opt/backups/app/app_2026-09-21_03-20-01.tar.gz', 'size': 1399477694, 'allocatedBytes': 1399488512, 'mtime': 1789960847.494755, 'ageHours': 712.612, 'inode': 2883619, 'device': 64769, 'nlink': 1, 'open': False}]}\nENV={'PATH':'/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin','HOME':'/root','PM2_HOME':'/root/.pm2','LC_ALL':'C'}\ndef emit(d):print(json.dumps(d),flush=True)\ndef command(a,timeout=180):\n p=subprocess.run(a,env=ENV,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=timeout)\n assert p.returncode==0,'MAINTENANCE_COMMAND_FAILED:'+a[0]\n return p.stdout.strip()\ndef free():\n s=os.statvfs('/home/runner/actions-runner');return s.f_bavail*s.f_frsize\ndef digest(p):\n h=hashlib.sha256()\n with open(p,'rb') as f:\n  for b in iter(lambda:f.read(1048576),b''):h.update(b)\n return h.hexdigest()\ndef opened():\n out=set()\n for f in glob.glob('/proc/[0-9]*/fd/*'):\n  try:m=os.stat(f);out.add((m.st_dev,m.st_ino))\n  except OSError:pass\n return out\ndef check(row):\n p=Path(row['path']);m=p.lstat()\n assert str(p.parent) in ['/opt/backups/app','/opt/backups/mysql'] and p.resolve()==p and not p.is_symlink()\n assert stat.S_ISREG(m.st_mode) and m.st_nlink==1 and (m.st_dev,m.st_ino) not in opened()\n assert m.st_ino==row['inode'] and m.st_dev==row['device'] and m.st_size==row['size'] and m.st_mtime==row['mtime'],'ARCHIVE_CHANGED_AFTER_INSPECTION'\n return p\nassert os.geteuid()==0\nassert command(['curl','--noproxy','*','-fsS','--max-time','3','http://169.254.169.254/metadata/v1/id'])=='545144175'\nroot=Path('/root/creatorvault');assert root.resolve()==root\nassert json.loads((root/'dist/public/release.json').read_text())['commit']=='3a47ce4dc7178893e958ed491a136c9749242033'\nlock=open('/run/creatorvault-authorized-backup-rotation.lock','a');fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\nstart=free();emit({'kind':'before_rotation','availableBytes':start,'authorizedScope':'exact stale backup archives and docker system prune -af --volumes'})\nprotected=[root/'.env',root/'dist/index.js',root/'dist/secure-app.js',root/'dist/public/release.json',root/'dist/consolidated-release-runtime.mjs',root/'.consolidated-release-state-3a47ce4dc7178893e958ed491a136c9749242033.json']\nbaseline=[digest(p) for p in protected]\nfor row in PLAN['retain']+PLAN['delete']:check(row)\n# Read the complete newest retained database archive; never restore/import SQL.\ndb=check(PLAN['retain'][0]);compressed_hash=digest(db);head=b'';tail=b'';count=0;decompressed=0\nwith gzip.open(db,'rb') as f:\n for block in iter(lambda:f.read(1048576),b''):\n  if not head:head=block[:4096]\n  tail=(tail+block)[-8192:];count+=block.count(b'CREATE TABLE ');decompressed+=len(block)\nassert (b'MySQL dump' in head or b'MariaDB dump' in head) and b'Dump completed on' in tail and count>20 and decompressed>1000000,'NEWEST_DATABASE_ARCHIVE_NOT_VERIFIED'\nemit({'kind':'retained_database_verified','path':str(db),'compressedSha256':compressed_hash,'gzipCrcPassed':True,'dumpCompletionMarker':True,'createTableCount':count,'decompressedBytes':decompressed,'restoreTestPerformed':False})\nretained_stat=[(row['path'],os.stat(row['path']).st_size,os.stat(row['path']).st_mtime) for row in PLAN['retain']]\nremoved=[]\nfor row in PLAN['delete']:\n p=check(row);assert row['mtime']<time.time()-48*3600\n assert re.fullmatch(r'(?:app_\\d{4}-\\d{2}-\\d{2}_\\d{2}-\\d{2}-\\d{2}\\.tar\\.gz|creatorvault_\\d{4}-\\d{2}-\\d{2}_\\d{2}-\\d{2}-\\d{2}\\.sql\\.gz)',p.name)\n p.unlink();removed.append({'path':str(p),'allocatedBytes':row['allocatedBytes']});emit({'kind':'stale_archive_removed',**removed[-1]})\nfor directory in ['/opt/backups/app','/opt/backups/mysql']:\n fd=os.open(directory,os.O_RDONLY|os.O_DIRECTORY);os.fsync(fd);os.close(fd)\nemit({'kind':'after_backup_rotation','availableBytes':free(),'retainedArchives':[x[0] for x in retained_stat],'archivedBytesRemoved':sum(x['allocatedBytes'] for x in removed)})\n# Explicit owner-authorized command, local socket only. No force-removal of active containers.\ndocker=command(['docker','--host','unix:///var/run/docker.sock','system','prune','-af','--volumes'],timeout=240)\nemit({'kind':'docker_prune_result','output':docker[:12000]})\nassert [digest(p) for p in protected]==baseline,'PROTECTED_LIVE_FILE_CHANGED'\nassert digest(db)==compressed_hash,'RETAINED_DATABASE_ARCHIVE_CHANGED'\nassert all(os.stat(p).st_size==size and os.stat(p).st_mtime==mtime for p,size,mtime in retained_stat)\nrows=json.loads(command(['pm2','jlist']));app=next(x for x in rows if x['name']=='creatorvault');assert app['pm2_env']['status']=='online'\nfinal=free();emit({'kind':'authorized_rotation_complete','availableBeforeBytes':start,'availableAfterBytes':final,'reclaimedBytes':final-start,'retainedDatabaseUnchanged':True,'retainedApplicationArchiveUnchanged':True,'protectedLiveFilesUnchanged':True,'liveDataDirectoriesNotTargeted':True,'pm2Pid':app['pid'],'legacyLifecycleNotMutatedByMaintenance':True,'externalSpendUsd':0})\nassert final>10*1024**3,'TEN_GIB_DEPLOYMENT_GATE_NOT_MET'\nPY\n"
