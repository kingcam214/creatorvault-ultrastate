name: CreatorVault Runner Storage Hygiene 2026-10-13
'on':
  push:
    branches:
    - ops/runner-storage-2026-10-13
permissions:
  contents: read
concurrency:
  group: creatorvault-production-security-release
  cancel-in-progress: false
jobs:
  hygiene:
    runs-on:
    - self-hosted
    - linux
    - creatorvault-production
    timeout-minutes: 20
    steps:
    - name: qualify backup retention and exact archive metadata
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REF\" = 'refs/heads/ops/runner-storage-2026-10-13'\nsudo -n /usr/bin/python3 - <<'PY'\nimport os,json,stat,time,subprocess,glob,hashlib\nfrom pathlib import Path\nENV={'PATH':'/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin','HOME':'/root','PM2_HOME':'/root/.pm2','LC_ALL':'C'}\ndef emit(d):print(json.dumps(d),flush=True)\ndef cmd(a,timeout=60):return subprocess.run(a,env=ENV,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=timeout).stdout.strip()\nassert os.geteuid()==0\nassert cmd(['curl','--noproxy','*','-fsS','--max-time','3','http://169.254.169.254/metadata/v1/id'])=='545144175'\nassert json.loads(Path('/root/creatorvault/dist/public/release.json').read_text())['commit']=='3a47ce4dc7178893e958ed491a136c9749242033'\nroot=Path('/opt/backups');assert root.resolve()==root and not root.is_symlink()\nopened=set()\nfor f in glob.glob('/proc/[0-9]*/fd/*'):\n try:m=os.stat(f);opened.add((m.st_dev,m.st_ino))\n except OSError:pass\nrows=[]\nfor p in root.rglob('*'):\n m=p.lstat()\n if stat.S_ISREG(m.st_mode):\n  rows.append({'path':str(p),'size':m.st_size,'allocatedBytes':m.st_blocks*512,'mtime':m.st_mtime,'ageHours':round((time.time()-m.st_mtime)/3600,3),'inode':m.st_ino,'device':m.st_dev,'nlink':m.st_nlink,'open':(m.st_dev,m.st_ino) in opened})\n else:assert stat.S_ISDIR(m.st_mode),'BACKUP_NONREGULAR_OR_SYMLINK'\nassert len(rows)<300\nfor row in sorted(rows,key=lambda x:x['mtime'],reverse=True):emit({'kind':'backup_file',**row})\ns=os.statvfs('/home/runner/actions-runner');emit({'kind':'capacity','availableBytes':s.f_bavail*s.f_frsize,'freeInodes':s.f_favail})\nfor args in [['docker','--host','unix:///var/run/docker.sock','system','df'],['docker','--host','unix:///var/run/docker.sock','ps','-a','--format','{{.ID}}\\t{{.Image}}\\t{{.Status}}']]:emit({'kind':'docker_before','command':args,'output':cmd(args)})\nemit({'kind':'backup_catalog_complete','productionChanged':False})\nPY\n"
